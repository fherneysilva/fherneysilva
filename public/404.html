    <style>
      :root {
        --navy: #16161a;
        --light-navy: #1e1e24;
        --lightest-navy: #2a2a32;
        --slate: #9b9aa3;
        --lightest-slate: #e5e3de;
        --amber: #e8a34d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--navy);
        color: var(--lightest-slate);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 32px 24px;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        max-width: 480px;
        margin: 0 auto;
      }

      #portrait {
        width: 180px;
        height: 180px;
        margin-bottom: 8px;
      }

      .code {
        font-size: 72px;
        font-weight: bold;
        line-height: 1;
        color: var(--amber);
        margin: 0;
      }

      h1 {
        font-family: "Libre Baskerville", serif;
        font-style: italic;
        font-weight: 400;
        font-size: 24px;
        color: var(--amber);
        margin: 14px 0 10px;
      }

      p {
        color: var(--slate);
        font-size: 15px;
        line-height: 1.6;
        margin: 0 0 28px;
      }

      .actions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      a.home-link {
        display: inline-block;
        font-weight: bold;
        font-size: 14px;
        color: var(--navy);
        background: var(--amber);
        border: 1px solid var(--amber);
        border-radius: 6px;
        padding: 10px 24px;
        text-decoration: none;
        transition: opacity 0.2s ease;
      }

      a.home-link:hover {
        opacity: 0.85;
      }

      .contact-links {
        display: flex;
        gap: 18px;
        font-size: 13px;
      }

      .contact-links a {
        color: var(--slate);
        text-decoration: underline;
      }

      .contact-links a:hover {
        color: var(--amber);
      }
    </style>
  </head>
